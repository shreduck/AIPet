name: Build Claude Pet

# Builds ClaudePet.exe (Windows) and ClaudePet.app (macOS, Apple Silicon) and publishes them as GitHub Release
# assets of this repo, so no binaries are committed:
#   push to master  -> the rolling "latest" release (re-created on every build, marked pre-release)
#   push a v* tag   -> a release for that version
#   manual run      -> the rolling "latest" release
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudePet-windows
          path: dist/ClaudePet.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14  # Apple Silicon runner: native arm64 Python, so PyInstaller builds an arm64 app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash build_mac.sh
      - name: Check architecture
        run: file dist/ClaudePet.app/Contents/MacOS/ClaudePet | tee /dev/stderr | grep -q arm64
      - name: Zip app
        run: ditto -c -k --keepParent dist/ClaudePet.app ClaudePet-mac-arm64.zip  # keeps the bundle's symlinks
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudePet-mac-arm64
          path: ClaudePet-mac-arm64.zip
          if-no-files-found: error

  release:
    needs: [windows, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create releases and upload their assets
    concurrency:
      group: publish-release  # one release update at a time
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p out
          cp artifacts/ClaudePet-windows/ClaudePet.exe out/
          cp artifacts/ClaudePet-mac-arm64/ClaudePet-mac-arm64.zip out/
          ls -la out
      - name: Version release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --title "Claude Pet $tag" --generate-notes --verify-tag
          fi
      - name: Rolling "latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Re-create it so its tag points at this commit and the assets are this build's.
          gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create latest out/* --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automatic build of ${GITHUB_SHA} on ${GITHUB_REF_NAME}.

          - **Windows:** \`ClaudePet.exe\` (unsigned: SmartScreen > More info > Run anyway)
          - **macOS, Apple Silicon:** \`ClaudePet-mac-arm64.zip\` (unsigned: unzip, then right-click the app > Open the first time)"
