name: Build Claude Pet
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudePet
          path: dist/ClaudePet.exe
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash build_mac.sh
      - name: Zip app
        run: ditto -c -k --keepParent dist/ClaudePet.app ClaudePet-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudePet-mac
          path: ClaudePet-mac.zip
