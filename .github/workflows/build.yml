name: Build AIPet

# Builds AIPet (Windows, a portable folder zipped as AIPet-windows-x64.zip) and AIPet.app (macOS, Apple Silicon) and publishes them as GitHub Release
# assets of this repo, so no binaries are committed:
#   push to master  -> the rolling "latest" release (re-created on every build, marked pre-release)
#   push a v* tag   -> a release for that version
#   manual run      -> the rolling "latest" release
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, for the version baked into the app (tools/write_version.py)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        env:
          PY: python  # the 3.12 above (Tcl/Tk 8.6, smaller than 3.14's Tcl 9), not the newest Python the py launcher finds
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: AIPet-windows
          path: dist/AIPet-windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-14  # Apple Silicon runner: native arm64 Python, so PyInstaller builds an arm64 app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, for the version baked into the app (tools/write_version.py)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash build_mac.sh
      - name: Check packaged hooks and relocation
        run: python tools/check_mac_bundle.py dist/AIPet.app
      - name: Check architecture
        run: file dist/AIPet.app/Contents/MacOS/AIPet | tee /dev/stderr | grep -q arm64
      - name: Zip app
        run: ditto -c -k --keepParent dist/AIPet.app AIPet-mac-arm64.zip  # keeps the bundle's symlinks
      - name: Disk image
        # The same app as a .dmg: LZMA-compressed (ULMO, macOS 10.15+), so noticeably smaller than the zip, with an
        # Applications link to drag it onto. The zip stays the release download the update message points to.
        run: |
          mkdir -p dmg
          ditto dist/AIPet.app dmg/AIPet.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname AIPet -srcfolder dmg -fs HFS+ -format ULMO -ov AIPet-mac-arm64.dmg
          hdiutil verify AIPet-mac-arm64.dmg
          ls -la AIPet-mac-arm64.zip AIPet-mac-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AIPet-mac-arm64
          path: |
            AIPet-mac-arm64.zip
            AIPet-mac-arm64.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create releases and upload their assets
    concurrency:
      group: publish-release  # one release update at a time
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p out
          cp artifacts/AIPet-windows/AIPet-windows-x64.zip out/
          cp artifacts/AIPet-mac-arm64/AIPet-mac-arm64.zip out/
          cp artifacts/AIPet-mac-arm64/AIPet-mac-arm64.dmg out/
          ls -la out
      - name: All-platform bundle
        # One zip with the Windows build and the Mac disk image, for catalogues that take a single file with a size
        # limit. Both are already compressed, so they are stored as they are.
        run: |
          mkdir -p bundle
          cp out/AIPet-windows-x64.zip out/AIPet-mac-arm64.dmg bundle/
          cat > bundle/README.txt <<'TXT'
          AIPet - a desktop pet for your AI sessions (Claude Code, Claude Cowork, Codex)
          https://github.com/shreduck/AIPet

          Windows 10/11: unzip AIPet-windows-x64.zip anywhere and run AIPet.exe inside the AIPet folder.
            The app is unsigned: in SmartScreen choose More info > Run anyway.
          macOS (Apple Silicon): open AIPet-mac-arm64.dmg and drag AIPet to Applications.
            The app is unsigned: the first time, right-click AIPet > Open.

          On first start AIPet lists the Claude Code and Codex installs it found; tick the ones to hook up.
          Cowork needs the plugin zip AIPet builds (Integrations > Claude Code hooks > Cowork).
          TXT
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("out/AIPet-all-platforms.zip", "w", zipfile.ZIP_STORED) as z:
              for name in ("AIPet-windows-x64.zip", "AIPet-mac-arm64.dmg", "README.txt"):
                  z.write("bundle/" + name, name)
          PY
          ls -la out
      - name: Version release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --title "AIPet $tag" --generate-notes --verify-tag
          fi
      - name: Rolling "latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Re-create it so its tag points at this commit and the assets are this build's.
          gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create latest out/* --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automatic build of ${GITHUB_SHA} on ${GITHUB_REF_NAME}.

          - **Windows:** \`AIPet-windows-x64.zip\`: unzip anywhere and run \`AIPet.exe\` inside (unsigned: SmartScreen > More info > Run anyway)
          - **macOS, Apple Silicon:** \`AIPet-mac-arm64.zip\` or \`AIPet-mac-arm64.dmg\` (unsigned: right-click the app > Open the first time)
          - **Both in one file:** \`AIPet-all-platforms.zip\` (the Windows zip and the Mac disk image)"
