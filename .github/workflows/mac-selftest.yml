name: macOS self-test

# Run by hand (Actions > macOS self-test > Run workflow). Starts AIPet on an Apple Silicon runner with a few fake
# sessions, takes screenshots and saves the app's diagnostics report, so drawing problems can be checked without a Mac.
# Two variants: the packaged .app (as users get it) and the plain Python source, to tell packaging problems apart
# from Tk/drawing ones. Results: the run's "Artifacts" section (selftest-app / selftest-source), kept 7 days;
# nothing is committed.
on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        mode: [app, source]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        if: matrix.mode == 'app'
        run: bash build_mac.sh
      - name: Install dependencies (source run)
        if: matrix.mode == 'source'
        run: python -m pip install --upgrade -r requirements.txt
      - name: Seed fake sessions
        run: python tools/seed_sessions.py
      - name: Install desktop probe dependencies
        run: python -m pip install pyobjc-framework-Quartz
      - name: Test desktop settings, Space switching and HTTPS
        timeout-minutes: 5
        run: |
          mkdir -p out/spaces
          if [ "${{ matrix.mode }}" = app ]; then
            dist/AIPet.app/Contents/MacOS/AIPet --selftest-spaces "$PWD/out/spaces" > out/spaces/app.log 2>&1 &
          else
            python aipet_app.py --selftest-spaces "$PWD/out/spaces" > out/spaces/app.log 2>&1 &
          fi
          PET_PID=$!
          trap 'kill "$PET_PID" 2>/dev/null || true' EXIT
          python tools/mac_spaces_test.py out/spaces
      - name: Collect desktop diagnostics
        if: always()
        run: |
          mkdir -p out/spaces
          cp ~/.aipet/error.log out/spaces/ 2>/dev/null || true
          if [ -f out/spaces/summary.json ]; then
            echo '### Desktop probe results' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat out/spaces/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run, screenshot, collect
        if: always()
        run: |
          mkdir -p out
          python tools/seed_sessions.py
          if [ "${{ matrix.mode }}" = app ]; then
            dist/AIPet.app/Contents/MacOS/AIPet --selftest > out/stdout.log 2>&1 &
          else
            python aipet_app.py --selftest > out/stdout.log 2>&1 &
          fi
          PID=$!
          sleep 6;  screencapture -x out/screen-1.png || echo "screencapture failed"
          sleep 4;  screencapture -x out/screen-2.png || true
          for i in $(seq 1 40); do kill -0 $PID 2>/dev/null || break; sleep 1; done  # the app quits itself after 20 s
          kill $PID 2>/dev/null || true
          cp ~/.aipet/diagnostics.txt ~/.aipet/error.log out/ 2>/dev/null || true
          ls -la out
          echo "---- diagnostics"; cat out/diagnostics.txt 2>/dev/null || echo "(no diagnostics written)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.mode }}
          path: out/
          retention-days: 7  # results live only on the run page, never in the repo

  image-probe:  # which ways of drawing an image macOS Tk paints on a transparent window (one screenshot)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pillow
      - name: Run probe and screenshot
        run: |
          mkdir -p out
          python tools/mac_image_probe.py 15 > out/stdout.log 2>&1 &
          sleep 6; screencapture -x out/probe.png || echo "screencapture failed"
          wait || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-probe
          path: out/
          retention-days: 7
